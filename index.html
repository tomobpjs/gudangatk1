<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Inventaris & BAST (Cloud Firebase)</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Times+New+Roman:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .bast-paper { width: 210mm; min-height: 297mm; padding: 15mm 20mm; background: #ffffff; color: #000000; box-sizing: border-box; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .bast-table th, .bast-table td { border: 1px solid #000000; padding: 6px 8px; }
        .bast-table th { background-color: #f3f4f6; font-weight: bold; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @media print { body { background: white !important; } body * { visibility: hidden; } #bast-preview-container, #bast-preview-container * { visibility: visible; } #bast-preview-container { position: absolute; left: 0; top: 0; width: 100%; } .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col md:flex-row">

    <!-- SIDEBAR NAVIGATION -->
    <aside id="sidebar" class="hidden md:flex w-64 bg-slate-900 text-white flex-shrink-0 flex-col justify-between min-h-screen z-40 sticky top-0 border-r border-slate-800">
        <div>
            <div class="p-5 border-b border-slate-800 flex items-center space-x-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl text-white"><i class="fa-solid fa-boxes-stacked text-xl"></i></div>
                <div><h1 class="font-bold text-base leading-tight" id="app-title-desktop">INVENTARIS PRO</h1></div>
            </div>
            <nav class="p-4 space-y-1.5">
                <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium bg-indigo-600 text-white"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span></button>
                <button onclick="switchTab('barang-masuk')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800"><i class="fa-solid fa-box-archive w-5"></i><span>Penerimaan</span></button>
            </nav>
        </div>
    </aside>

    <!-- KONTEN UTAMA -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full">
        <!-- Konten tetap sama seperti sebelumnya -->
    </main>

    <!-- SCRIPT UTAMA (GABUNGAN LOGIKA) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi
        const firebaseConfig = {
  apiKey: "AIzaSyBiEWqdYX8zOjRwv4Mo1DRlFcSLsG8OhlQ",
  authDomain: "gudangatk.firebaseapp.com",
  databaseURL: "https://gudangatk-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gudangatk",
  storageBucket: "gudangatk.firebasestorage.app",
  messagingSenderId: "274324790135",
  appId: "1:274324790135:web:8b67b0c39524d2cf2cdf72",
  measurementId: "G-KCYZG0ZZGR"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Definisi fungsi agar tersedia secara global (window)
        window.handleMasukSubmit = async function(e) {
            e.preventDefault();
            
            // Mengambil input dari form (asumsi form ID: form-masuk)
            const formData = new FormData(document.getElementById('form-masuk'));
            const data = Object.fromEntries(formData.entries());

            try {
                // Gunakan setDoc atau addDoc langsung di sini
                // Contoh: Menyimpan ke koleksi 'inventaris'
                const colRef = collection(db, 'inventaris');
                await addDoc(colRef, {
                    ...data,
                    timestamp: new Date().toISOString()
                });
                
                Swal.fire('Berhasil', 'Data berhasil disimpan ke cloud!', 'success');
            } catch (error) {
                console.error("Error:", error);
                Swal.fire('Gagal', 'Gagal menyimpan: ' + error.message, 'error');
            }
        };

        console.log("Firebase & Fungsi Global siap.");
    </script>
</body>
</html>
